<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Curing..... | KEA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="My new page is Reviving soon.!" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <!-- PNG version -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2933, #0b1120);
      color: #f9fafb;
    }

    .container {
      max-width: 600px;
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-radius: 1rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      font-size: 1rem;
      color: #d1d5db;
      margin-bottom: 1.75rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .countdown-item {
      min-width: 70px;
      padding: 0.75rem 0.5rem;
      border-radius: 0.75rem;
      background: rgba(30, 64, 175, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.6);
    }

    .countdown-item span.value {
      display: block;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .countdown-item span.label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9ca3af;
      margin-top: 0.25rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    input[type="email"] {
      padding: 0.7rem 0.9rem;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #f9fafb;
      min-width: 220px;
    }

    input[type="email"]::placeholder {
      color: #6b7280;
    }

    button {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #22c55e);
      color: #f9fafb;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.6);
    }

    .note {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 0.5rem;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }
      .container {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">KEA</div>
    <div class="logo">Kaye Eloisa A.</div>
    <h1>Revive Soon</h1>
    <p class="subtitle">
      In a curing phase.....
    </p>

          <div class="footer">
      © <span id="year"></span> KEA 2026. All rights reserved.
    </div>
  </script>
</body>
</html>
